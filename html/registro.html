<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Pixel Store</title>

    <link rel="stylesheet" href="registro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="register-box">

            <div class="logo">
                <i class="fa-solid fa-gamepad"></i>
                <h2>Pixel Store</h2>
            </div>

            <h1>Crear cuenta</h1>

            <p>Regístrate y comienza tu aventura gamer.</p>

            <form action="../html/seccion1-sesion-iniciada.html">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Nombre completo" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-user-tag"></i>
                    <input type="text" placeholder="Nombre de usuario" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Correo electrónico" required>
                </div>

                <div class="birth-title">
                    <label>Fecha de nacimiento</label>
                </div>

                <div class="birth-date">

                    <select required>
                        <option value="" selected disabled>Día</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>

                    <select required>
                        <option value="" selected disabled>Mes</option>
                        <option>Enero</option>
                        <option>Febrero</option>
                        <option>Marzo</option>
                        <option>Abril</option>
                        <option>Mayo</option>
                        <option>Junio</option>
                        <option>Julio</option>
                        <option>Agosto</option>
                        <option>Septiembre</option>
                        <option>Octubre</option>
                        <option>Noviembre</option>
                        <option>Diciembre</option>
                    </select>

                    <select required>
                        <option value="" selected disabled>Año</option>
                        <option>2012</option>
                        <option>2011</option>
                        <option>2010</option>
                        <option>2009</option>
                        <option>2008</option>
                        <option>2007</option>
                        <option>2006</option>
                        <option>2005</option>
                        <option>2004</option>
                        <option>2003</option>
                        <option>2002</option>
                        <option>2001</option>
                        <option>2000</option>
                        <option>1999</option>
                        <option>1998</option>
                        <option>1997</option>
                        <option>1996</option>
                        <option>1995</option>
                        <option>1994</option>
                        <option>1993</option>
                        <option>1992</option>
                        <option>1991</option>
                        <option>1990</option>
                        <option>1989</option>
                        <option>1988</option>
                        <option>1987</option>
                        <option>1986</option>
                        <option>1985</option>
                        <option>1984</option>
                        <option>1983</option>
                        <option>1982</option>
                        <option>1981</option>
                        <option>1980</option>
                    </select>

                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirmar contraseña" required>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        Acepto los términos y condiciones
                    </label>
                </div>
                
                <button type="submit" class="register-btn">
                    Crear cuenta
                </button>

            </form>

            <div class="separator">
                <span>o regístrate con</span>
            </div>

            <div class="social">

                <a href="#" class="facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#" class="twitter">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

                <a href="#" class="google">
                    <i class="fa-brands fa-google"></i>
                </a>

            </div>

            <div class="login">
                <p>¿Ya tienes una cuenta?</p>
                <a href="../html/iniciar.html">Iniciar sesión</a>
            </div>

        </div>

    </div>

</body>

</html>
