<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Pixel Store</title>

    <link rel="stylesheet" href="iniciar.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">

                <i class="fa-solid fa-gamepad"></i>

                <h2>Pixel Store</h2>

            </div>

            <h1>Bienvenido</h1>

            <p>Inicia sesión para continuar comprando tus videojuegos favoritos.</p>

            <form>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" placeholder="Correo electrónico">

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Contraseña">

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Recordarme

                    </label>

                    <a href="../html/olvidar.html">¿Olvidaste tu contraseña?</a>

                </div>

                <button class="login-btn">

                    <a href="../html/seccion1-sesion-iniciada.html" style="text-decoration: none; color: inherit;">Iniciar sesión</a>

                </button>

            </form>

            <div class="separator">

                <span>o continúa con</span>

            </div>

            <div class="social">

                <a href="#" class="facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="#" class="twitter">

                    <i class="fa-brands fa-x-twitter"></i>

                </a>

                <a href="#" class="google">

                    <i class="fa-brands fa-google"></i>

                </a>

            </div>

            <div class="register">

                <p>¿No tienes una cuenta?</p>

                <a href="../html/registro.html">Crear cuenta</a>

            </div>

        </div>

    </div>

</body>

</html>
