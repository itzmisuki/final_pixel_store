<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Pixel Store</title>

    <link rel="stylesheet" href="olvidar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="recover-box">

            <!-- ICONO -->
            <div class="icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>

            <!-- TITULO -->
            <h1>Recuperar contraseña</h1>

            <p class="subtitle">
                ¿Olvidaste tu contraseña? Ingresa tu correo electrónico y utiliza
                el código de recuperación para restablecerla.
            </p>

            <form>

                <!-- CORREO -->
                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Correo electrónico"
                            required>

                    </div>

                </div>

                <!-- ENVIAR CODIGO -->
                <button type="button" class="send-button">
                    <i class="fa-solid fa-paper-plane"></i>
                    Enviar código
                </button>

                <!-- CODIGO -->
                <div class="form-group">

                    <label for="codigo">
                        Código de recuperación
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-key"></i>

                        <input
                            type="text"
                            id="codigo"
                            name="codigo"
                            placeholder="Ingresa el código"
                            maxlength="6">

                    </div>

                </div>

                <!-- NUEVA CONTRASEÑA -->
                <div class="form-group">

                    <label for="password">
                        Nueva contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nueva contraseña">

                    </div>

                </div>

                <!-- CONFIRMAR -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirmar contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirmar contraseña">

                    </div>

                </div>

                <!-- RESTABLECER -->
                <button type="submit" class="reset-button">
                    Restablecer contraseña
                </button>

            </form>

            <!-- INFORMACION -->
            <div class="info-box">

                <i class="fa-solid fa-circle-info"></i>

                <span>
                    El código de recuperación será enviado al correo electrónico registrado.
                </span>

            </div>

            <!-- SEPARADOR -->
            <div class="separator"></div>

            <!-- VOLVER -->
            <div class="back-login">

                <a href="../html/iniciar.html">

                    Volver a iniciar sesión
                </a>

            </div>

        </div>

    </div>

</body>

</html>
